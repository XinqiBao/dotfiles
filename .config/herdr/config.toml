onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[terminal]
new_cwd = "follow"

[keys]
# Checked against Herdr 0.9.5. "" disables a binding.
prefix = "ctrl+a"

# General
help = "prefix+?"
settings = "prefix+s"
reload_config = "prefix+r"
detach = "prefix+q"
goto = "prefix+p"
toggle_sidebar = "prefix+b"
open_notification_target = ""

# Workspaces
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
workspace_picker = ""
new_workspace = ""
new_worktree = ""
rename_workspace = ""
close_workspace = ""

# Tabs
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
switch_tab = ["alt+1..9", "prefix+1..9"]
new_tab = ""
rename_tab = ""
close_tab = ""

# Panes
focus_pane_left = ["alt+h", "prefix+h"]
focus_pane_down = ["alt+j", "prefix+j"]
focus_pane_up = ["alt+k", "prefix+k"]
focus_pane_right = ["alt+l", "prefix+l"]
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"
zoom = "prefix+z"
copy_mode = "prefix+["
close_pane = ""
cycle_pane_next = ""
cycle_pane_previous = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
rename_pane = ""
resize_mode = ""
edit_scrollback = ""

# Remote attach only
remote_image_paste = "ctrl+v"

[[keys.command]]
key = "prefix+c"
type = "shell"
command = '"$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HOME" --focus'
description = "new tab in Home"

[ui]
prompt_new_tab_name = false
tab_bar_right = [{ type = "datetime", format = "%H:%M" }]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false
