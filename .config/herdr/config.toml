onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[terminal]
new_cwd = "follow"

[keys]
# Checked against Herdr 0.9.5. "" disables a binding.
prefix = "ctrl+a"

# General
help = "prefix+?"
settings = "prefix+s"
reload_config = "prefix+r"
detach = "prefix+q"
goto = "prefix+w"
toggle_sidebar = "prefix+b"
open_notification_target = ""

# Workspaces
previous_workspace = "alt+k"
next_workspace = "alt+j"
workspace_picker = ""
new_workspace = ""
new_worktree = ""
rename_workspace = ""
close_workspace = ""

# Tabs
previous_tab = ["alt+shift+j", "prefix+p"]
next_tab = ["alt+shift+k", "prefix+n"]
switch_tab = ["alt+1..9", "prefix+1..9"]
new_tab = ""
rename_tab = ""
close_tab = ""

# Panes
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"
zoom = "prefix+z"
copy_mode = "prefix+["
close_pane = ""
cycle_pane_next = ""
cycle_pane_previous = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
rename_pane = ""
resize_mode = ""
edit_scrollback = ""

# Remote attach only
remote_image_paste = "ctrl+v"

[[keys.command]]
key = "prefix+c"
type = "shell"
command = '"$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HOME" --focus'
description = "New tab in home directory"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

[ui]
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false
